==============================================================================================================================
This is a 'PRIMO.exe' configuration file.
==============================================================================================================================

Key meaning:
==============================================================================================================================
1 [PRIMOPath]           =  The whole path to PRIMO.EXE 
1 [PenEasyLinacPath]    =  The whole path to 'PenEasyLinacName' program 
1 [PenEasyLinacName]    =  The name of the PenEasyLinac program 
  [PenEasyLinacOutPath] =  The sub-path to PenEasyLinac output files (Whole path = PenEasyLinacPath + PenEasyLinacOutPath)
  [CTMaterialsPath]     =  The sub-path to materials used in CT volume simulation (PenEasyLinacPath + CTMaterialsPath)
  [PenEasyLinacInput]   =  The 'PenEasyLinacName' input file generated by PRIMO
  [PenEasyLinacOut]     =  The file to which 'PenEasyLinacName' will redirect its std output 
0 [PenEasyLinacPlus]    =  Input file containing extra input data to 'PenEasyLinacName' (generated by PRIMO) 
  [PenEasyPath]         =  The sub-path to 'PenEasyName' program (Whole path = PenEasyLinacPath + PenEasyPath)
1 [PenEasyName]         =  The name of the PenEasy program 
0 [PenEasyInput]        =  The PenEasy input file generated by PenEasyLinac  
  [PenEasyOut]          =  The file to which 'PenEasyName' will redirect its std output
0 [PenEasyTallyDos]     =  The PenEasy report file created when tally is a spatial dose distribution
0 [PenEasyTallyVoxDos]  =  The PenEasy report file created when tally is a voxelized dose distribution
0 [PenEasyTallyPS]      =  The PenEasy report file created when tally is a phase space
==============================================================================================================================
0 Do not change these (they are wired into programs!)
1 More likely to be changed

 Rules !!!
 ==============================================================================================================================
 Following rules apply:
 - The command sequence must be not altered.
 - Path names must not include the \ character at the end.
 - Do not introduce any text line (comments or whatever) nor
   space characters in the command sequence.
 - Sub paths names (i.e. the PenEasyLinac output folder) must
   have the \ character at the begining (and not at the end).
 - The command format is [key]=value. Do not change this format
   nor the key names. 
 - Keys are case sensitive!  
 - Include file extensions in all cases.
 - The program PRIMO does manipulate the standard IN/OUT of the 
   external processes (PenEasyLinacName and PenEasyName) so:
   - Do not use DOS batch files to replace the actual executables.

